task-meta{color:var(--muted);margin:3px 0 10px}.task-actions{display:flex;gap:10px;flex-wrap:wrap}.task-actions button{min-width:180px;min-height:60px;background:#fff;color:var(--ink);border:2px solid #70808a}.task-actions button:hover{background:var(--softblue)}.empty{background:#fff;border:2px dashed #7a8991;padding:18px;border-radius:10px;color:var(--muted)}.primary-wide{width:100%;min-height:74px;font-size:24px;margin:24px 0}.week-list{display:grid;gap:14px}.day-card{background:white;border:2px solid #9ba7ac;padding:16px 20px;border-radius:12px}.day-card.today{border:4px solid var(--green);background:#e8f2eb}.day-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.day-head h3{font-size:24px}.week-items{padding-top:6px}.week-item{padding:7px 0;border-top:1px solid #c5cccf}.week-item.is-done{text-decoration:line-through;color:var(--done)}.done-summary{font-size:27px;background:var(--pale);padding:19px;border-radius:12px;font-weight:700}.group-title{margin:24px 0 10px}.done-row{background:#fff;border:2px solid #8a979d;padding:14px 18px;margin:9px 0;border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:15px}.done-row .task-title{text-decoration:line-through}.done-row button{min-height:60px;min-width:180px;background:#fff;border:2px solid #70808a;color:var(--ink)}.templates{background:#fff;border:2px solid var(--line);border-radius:12px;padding:20px;margin-bottom:24px}.template-group{margin:18px 0}.template-group h3{margin-bottom:10px}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{min-height:62px;width:100%;text-align:left;background:#f3f5f3;color:var(--ink);border:2px solid #839097}.tile:hover{background:var(--pale)}.form-panel{background:#fff;border:2px solid var(--line);border-radius:12px;padding:22px}.choice-row{display:flex;gap:10px;flex-wrap:wrap}.choice-row button{background:#fff;color:var(--ink);border:2px solid #71818a}.choice-row button.selected{background:var(--green);color:#fff;border-color:var(--green)}.form-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.form-actions .save{min-height:70px;min-width:230px;font-size:22px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);max-width:min(760px,calc(100% - 28px));background:#102a38;color:#fff;padding:16px 22px;border-radius:12px;font-weight:700;z-index:5;box-shadow:0 5px 24px #0004;animation:appear .2s}.overdue{background:#f1eee5;border:1px solid #77858b;padding:10px 14px;border-radius:9px;margin:8px 0}.soft-danger{background:#fff;color:#3e3330;border:2px solid #796961;margin-top:22px}.screen-footer{border-top:1px solid var(--line);margin-top:30px;padding-top:14px;color:var(--muted)}.hide{display:none!important}@keyframes appear{from{opacity:.45;transform:translateY(5px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}@media(max-width:700px){body{font-size:19px}.wrap{padding:0 14px}.header{align-items:flex-start;flex-direction:column;padding:14px 0;gap:8px}.strap{font-size:16px}.header-right{width:100%;justify-content:space-between}.nav{flex-wrap:nowrap;overflow:auto}.nav button{min-width:180px}.greeting{display:block}h1{font-size:33px}.task-title{font-size:21px}.tiles{grid-template-columns:1fr}.done-row{align-items:flex-start;flex-direction:column;width:100%}.done-row button{width:100%}.task-card{padding:12px;grid-template-columns:66px 1fr;gap:9px}.check{min-width:60px;width:60px;height:60px}.day-head{display:block}}
</style></head><body><div class="wrap"><header class="header"><div><div class="brand"><b>Луна Академия</b>: Мои дела</div><div class="strap">Все ваши дела на одном экране — крупно и понятно. Сегодня, на неделю, что уже сделано.</div></div><div id="headerRight" class="header-right"></div></header><main id="app" class="screen"></main><footer id="footer" class="screen-footer hide">Для семьи: «Мама не забудет про врача и не забудет позвонить — всё записано, ничего не потеряется».</footer></div><div id="toast" class="toast hide" role="status" aria-live="polite"></div><script>
'use strict';
const USERS={nina:{name:'Нина',password:'1234'},boris:{name:'Борис',password:'1234'},test:{name:'Тестовый пользователь',password:'test'}};
const TEMPLATES=[['💊 Здоровье',[['Принять таблетки','💊','morning'],['Записаться к врачу','🩺','day'],['Позвонить в поликлинику','☎️','morning'],['Измерить давление','🩺','morning']]],['👨‍👩‍👧 Семья',[['Позвонить внуку','📞','day'],['Позвонить дочери / сыну','📞','evening'],['Написать в мессенджере','💬','day'],['Поздравить с днём рождения','🎂','day']]],['🏠 Дом',[['Купить продукты','🛒','day'],['Оплатить ЖКХ','🧾','day'],['Полить цветы','🪴','evening'],['Погулять на улице','🚶','day']]],['📺 Отдых',[['Посмотреть передачу','📺','evening'],['Почитать книгу','📖','evening'],['Позвонить подруге','☎️','day']]]];
const PERIOD={morning:'🌅 Утром',day:'☀️ Днём',evening:'🌙 Вечером'};
const app=document.querySelector('#app'),headerRight=document.querySelector('#headerRight'),footer=document.querySelector('#footer'),toastBox=document.querySelector('#toast');
const pad=n=>String(n).padStart(2,'0');function isoDate(d=new Date()){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}function fromISO(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}function addDays(s,n){const d=fromISO(s);d.setDate(d.getDate()+n);return isoDate(d)}function mondayOf(s){const d=fromISO(s),wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);return isoDate(d)}function dateLabel(s,opts={weekday:'long',day:'numeric',month:'long'}){const x=new Intl.DateTimeFormat('ru-RU',opts).format(fromISO(s));return x.charAt(0).toLocaleUpperCase('ru-RU')+x.slice(1)}function safe(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function current(){try{return JSON.parse(localStorage.getItem('luna_user'))}catch{return null}}function saveUser(u){localStorage.setItem('luna_user',JSON.stringify(u))}let user=current(),tasks=[],editId=null,flashTimer=null;
function seed(name){const d=isoDate(),y=addDays(d,-1);const base=[{id:'n1',title:'Принять таблетки от давления',emoji:'💊',date:d,time:'09:00',period:'morning',repeat:'once',completed:{[d]:'09:15'}},{id:'n2',title:'Позвонить внуку Мише',emoji:'📞',date:d,time:'10:30',period:'morning',repeat:'once',completed:{[d]:'10:42'}},{id:'n3',title:'Записаться к врачу',emoji:'🩺',date:d,time:'14:00',period:'day',repeat:'once',completed:{}},{id:'n4',title:'Купить хлеб и молоко',emoji:'🛒',date:d,time:'После обеда',period:'day',repeat:'once',completed:{}},{id:'n5',title:'Полить цветы',emoji:'🪴',date:d,time:'Вечером',period:'evening',repeat:'once',completed:{}},{id:'n6',title:'Позвонить дочери',emoji:'📞',date:d,time:'19:00',period:'evening',repeat:'once',completed:{}},{id:'n7',title:'Забрать рецепт в аптеке',emoji:'💊',date:y,time:'11:00',period:'morning',repeat:'once',completed:{}}];if(name==='boris')return base.map((x,i)=>({...x,id:'b'+i,completed:i===0?x.completed:{}}));if(name==='test')return base.filter((_,i)=>[0,2,4].includes(i)).map((x,i)=>({...x,id:'t'+i,completed:i===0?x.completed:{}}));return base}
function loadTasks(){const key=`luna_tasks_${user.login}`;try{const v=JSON.parse(localStorage.getItem(key));if(Array.isArray(v)){tasks=v;return}}catch{}tasks=seed(user.login);persist()}function persist(){localStorage.setItem(`luna_tasks_${user.login}`,JSON.stringify(tasks))}function repeatOccurs(t,d){if(d<t.date)return false;if(t.repeat==='daily')return true;if(t.repeat==='weekly')return fromISO(d).getDay()===fromISO(t.date).getDay();return d===t.date}function dueOn(d){return tasks.filter(t=>repeatOccurs(t,d))}function doneOn(t,d){return Boolean(t.completed&&t.completed[d])}function periodOf(t){if(t.period)return t.period;if(/^([01]\d|2[0-3]):[0-5]\d$/.test(t.time)){const h=Number(t.time.slice(0,2));return h<12?'morning':h<18?'day':'evening'}return 'day'}function timeNow(){return new Intl.DateTimeFormat('ru-RU',{hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date())}function showToast(text){toastBox.textContent=text;toastBox.classList.remove('hide');clearTimeout(flashTimer);flashTimer=setTimeout(()=>toastBox.classList.add('hide'),3300)}
const GOOGLE_CLIENT_ID='598819156685-pdli5q93l8rn6ilfqbvpecbccsimb8o9.apps.googleusercontent.com';function initGoogleButton(){const box=document.querySelector('#googleButton');let attempts=0;const wait=setInterval(()=>{if(!box?.isConnected){clearInterval(wait);return}if(window.google?.accounts?.id){clearInterval(wait);const nonce=Array.from(crypto.getRandomValues(new Uint8Array(24)),x=>x.toString(16).padStart(2,'0')).join('');window.google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,nonce,callback:response=>{try{const parts=response.credential.split('.');if(parts.length!==3)throw Error();const text=parts[1].replace(/-/g,'+').replace(/_/g,'/'),claims=JSON.parse(decodeURIComponent(escape(atob(text+'='.repeat((4-text.length%4)%4)))));if(claims.aud!==GOOGLE_CLIENT_ID||!['accounts.google.com','https://accounts.google.com'].includes(claims.iss)||claims.exp<=Date.now()/1000||claims.nonce!==nonce||claims.email_verified!==true||!claims.email)throw Error();user={login:'google:'+claims.email.toLowerCase(),name:claims.name||claims.email,provider:'google'};saveUser(user);loadTasks();go('today')}catch{showToast('Не удалось проверить вход Google. Попробуйте ещё раз.')}}});window.google.accounts.id.renderButton(box,{type:'standard',theme:'outline',size:'large',text:'signin_with',shape:'rectangular',width:320});return}if(++attempts>100)clearInterval(wait)},100)}function go(path){location.hash='#/'+path}function loginScreen(){headerRight.innerHTML='';footer.classList.add('hide');app.innerHTML=`<section class="login"><h1>Луна Академия: Мои дела</h1><p class="intro">Все ваши дела на одном экране — крупно и понятно. Сегодня, на неделю, что уже сделано.</p><iframe id="loginFrame" class="login-frame" src="${['owlet.bond','www.owlet.bond'].includes(location.hostname)?`https://auth.owlet.bond/planner-login.html?parent=${encodeURIComponent(location.origin)}`:'planner-login.html'}" title="Вход по логину и паролю" loading="eager"></iframe><div class="or-login">Или войдите через Google</div><div id="googleButton"></div><div class="family"><strong>Для семьи:</strong> «Мама не забудет про врача и не забудет позвонить — всё записано, ничего не потеряется».</div></section>`;initGoogleButton();window.addEventListener('message',e=>{if(![location.origin,'https://auth.owlet.bond'].includes(e.origin))return;const frame=document.querySelector('#loginFrame');if(e.source!==frame?.contentWindow||e.data?.type!=='luna-planner-login')return;const account=USERS[e.data.login];if(!account||account.name!==e.data.name)return;user={login:e.data.login,name:e.data.name};saveUser(user);loadTasks();go('today')})}
function nav(){return `<nav class="nav" aria-label="Разделы"><a href="#/today"><button class="${route==='today'?'current':''}">Сегодня ☀️</button></a><a href="#/week"><button class="${route==='week'?'current':''}">На неделе 📅</button></a><a href="#/done"><button class="${route==='done'?'current':''}">Сделано ✅</button></a><a href="#/add"><button class="${route==='add'?'current':''}">Добавить дело ➕</button></a></nav>`}
function header(){headerRight.innerHTML=`<span class="muted">${safe(user.name)}</span><button id="logout" class="quiet">Выйти</button>`;document.querySelector('#logout').onclick=()=>{localStorage.removeItem('luna_user');user=null;go('login')};footer.classList.remove('hide')}
function taskCard(t,d,completed){const title=`${safe(t.emoji||'📝')} ${safe(t.title)}`,when=t.time||PERIOD[periodOf(t)],stamp=t.completed&&t.completed[d];return `<article class="task-card ${completed?'completed':''}"><button class="check" data-done="${safe(t.id)}" data-day="${d}" aria-label="${completed?'Вернуть в дела':'Сделано'}: ${safe(t.title)}">${completed?'✓':''}</button><div><div class="task-title">${title}</div><div class="task-meta">⏰ ${safe(when)}${completed?` · ✅ Готово, в ${safe(stamp)}`:''}</div><div class="task-actions">${completed?`<button data-undo="${safe(t.id)}" data-day="${d}">↩️ Вернуть в дела</button>`:`<button data-done="${safe(t.id)}" data-day="${d}">✅ Сделано</button><button data-edit="${safe(t.id)}">✏️ Изменить</button><button data-delete="${safe(t.id)}">🗑 Удалить</button>`}</div></div></article>`}
function reminders(d){const now=new Date(),out=[];for(const t of dueOn(d)){if(doneOn(t,d)||!/^\d{2}:\d{2}$/.test(t.time||''))continue;const [h,m]=t.time.split(':').map(Number),delta=Math.abs((now.getHours()*60+now.getMinutes())-(h*60+m));const key=`reminded_${t.id}_${d}`;if(delta<=5&&!sessionStorage.getItem(key)){sessionStorage.setItem(key,'1');out.push(t)}}return out.length?`<div class="reminder">${out.map(t=>`🔔 Сейчас ${safe(t.time)} — пора: ${safe(t.emoji)} ${safe(t.title)}`).join('<br>')}</div>`:''}
function todayScreen(){const d=isoDate(),todays=dueOn(d),count=todays.length,done=todays.filter(t=>doneOn(t,d)).length;let html=`<div class="greeting"><div><h1>Здравствуйте, ${safe(user.name)}!</h1><div class="date">${dateLabel(d)}</div></div></div>${reminders(d)}<div class="summary">Сегодня ${count} дел · ${done} уже сделано</div>`;for(const [key,label] of [['morning','🕐 Утром'],['day','☀️ Днём'],['evening','🌙 Вечером']]){const group=todays.filter(t=>periodOf(t)===key).sort((a,b)=>(doneOn(a,d)?1:0)-(doneOn(b,d)?1:0)||(a.time||'').localeCompare(b.time||''));html+=`<section class="block"><div class="block-title"><h2>${label}</h2></div>${group.length?group.map(t=>taskCard(t,d,doneOn(t,d))).join(''):'<div class="empty">На это время дел нет. Хорошего дня! ☀️</div>'}</section>`}const overdue=tasks.filter(t=>t.repeat==='once'&&t.date<d&&!doneOn(t,t.date)&&t.date>=addDays(d,-7));if(overdue.length)html+=`<section class="block"><h2>Можно сделать, когда удобно</h2>${overdue.map(t=>`<div class="overdue">Это дело было на ${t.date===addDays(d,-1)?'вчера':'прошлой неделе'} — сделайте, когда удобно.<br>${taskCard(t,t.date,false)}</div>`).join('')}</section>`;html+=`<button class="primary-wide" id="addMain">➕ Добавить дело</button>`;return html}
function weekScreen(){const monday=mondayOf(isoDate()),today=isoDate();let html=`<button class="quiet" id="backToday">← Назад на сегодня</button><h1 style="margin-top:18px">На неделе</h1><p class="muted">Планы на ближайшие семь дней.</p><div class="week-list">`;for(let i=0;i<7;i++){const d=addDays(monday,i),items=dueOn(d);html+=`<section class="day-card ${d===today?'today':''}"><div class="day-head"><h3>${dateLabel(d)}</h3>${d===today?'<strong>Сегодня</strong>':''}</div><div class="week-items">${items.length?items.map(t=>`<div class="week-item ${doneOn(t,d)?'is-done':''}">${safe(t.emoji)} ${safe(t.time||PERIOD[periodOf(t)])} · ${safe(t.title)} ${doneOn(t,d)?`— ✅ Готово, в ${safe(t.completed[d])}`:d<today?`<span class="muted">— Это дело было на вчера — сделайте, когда удобно</span>`:`<button class="check" data-done="${safe(t.id)}" data-day="${d}" aria-label="Сделано: ${safe(t.title)}">□</button>`}</div>`).join(''):'<div class="empty">Дел нет</div>'}</div></section>`}return html+'</div>'}
function doneScreen(){const today=isoDate(),monday=mondayOf(today),yesterday=addDays(today,-1);let records=[];for(const t of tasks)for(const [d,at] of Object.entries(t.completed||{}))if(d>=addDays(today,-7)&&d<=today)records.push({t,d,at});records.sort((a,b)=>b.d.localeCompare(a.d)||b.at.localeCompare(a.at));const thisWeek=records.filter(x=>x.d>=monday).length;let html=`<h1>Сделано ✅</h1><div class="done-summary">На этой неделе вы сделали ${thisWeek} дел 👍</div>`;for(const [d,label] of [[today,'Сегодня'],[yesterday,'Вчера'],[monday,'На этой неделе']]){const rows=records.filter(x=>x.d===d||(label==='На этой неделе'&&x.d>=monday&&x.d<yesterday));if(!rows.length)continue;html+=`<h2 class="group-title">${label==='На этой неделе'?`${label} · ${dateLabel(d,{day:'numeric',month:'long'})}`:label}</h2>${rows.map(({t,d:day,at})=>`<div class="done-row"><div><div class="task-title">${safe(t.emoji)} ${safe(t.title)}</div><div class="task-meta">✅ ${dateLabel(day,{day:'numeric',month:'long'})} в ${safe(at)}</div></div><button data-undo="${safe(t.id)}" data-day="${day}">↩️ Вернуть в дела</button></div>`).join('')}`}if(!records.length)html+='<div class="empty">Здесь появятся дела, которые вы отметите как сделанные.</div>';html+=`<button class="soft-danger" id="clearOld">Очистить сделанное за прошлую неделю</button>`;return html}
function templateMarkup(){return `<section class="templates"><h2>Выберите готовое дело</h2>${TEMPLATES.map(([category,items])=>`<div class="template-group"><h3>${category}</h3><div class="tiles">${items.map(([title,emoji,period])=>`<button class="tile" data-template="${safe(title)}" data-emoji="${safe(emoji)}" data-period="${period}">${emoji} ${title}</button>`).join('')}</div></div>`).join('')}</section>`}
function addScreen(){const edit=editId?tasks.find(t=>t.id===editId):null;return `${templateMarkup()}<section class="form-panel"><h2>${edit?'Изменить дело':'Или впишите своё дело'}</h2><form id="taskForm"><div class="field"><label for="taskTitle">Название дела</label><input id="taskTitle" maxlength="100" placeholder="Например, позвонить Нине Петровне" required value="${safe(edit?.title||'')}"></div><div class="field"><label for="taskEmoji">Значок категории</label><select id="taskEmoji"><option>📝</option><option>💊</option><option>🩺</option><option>📞</option><option>💬</option><option>🛒</option><option>🏠</option><option>🪴</option><option>🚶</option><option>📺</option><option>📖</option></select></div><div class="field"><label>День</label><div class="choice-row"><button type="button" class="dayChoice" data-day-choice="today">Сегодня</button><button type="button" class="dayChoice" data-day-choice="tomorrow">Завтра</button><button type="button" class="dayChoice" data-day-choice="pick">Выбрать дату</button></div><input id="taskDate" type="date" value="${safe(edit?.date||isoDate())}" required style="margin-top:10px"></div><div class="field"><label for="taskPeriod">Время</label><select id="taskPeriod"><option value="morning">🌅 Утром</option><option value="day">☀️ Днём</option><option value="evening">🌙 Вечером</option></select><label for="taskTime">Или укажите точное время</label><input id="taskTime" type="time" value="${/^\d{2}:\d{2}$/.test(edit?.time||'')?safe(edit.time):''}"></div><div class="field"><label for="taskRepeat">Повтор</label><select id="taskRepeat"><option value="once">Один раз</option><option value="daily">Каждый день</option><option value="weekly">Каждую неделю</option></select></div><div class="form-actions"><button class="save">${edit?'Сохранить изменения':'Сохранить дело'}</button><button type="button" class="quiet" id="cancelAdd">Отмена</button></div></form></section>`}
let route='today';function render(){if(!user){route='login';if(!location.hash||location.hash!=='#/login')location.hash='#/login';loginScreen();return}header();const hash=(location.hash||'#/today').replace(/^#\//,'');route=['today','week','done','add'].includes(hash)?hash:'today';if(route==='today')app.innerHTML=nav()+todayScreen();if(route==='week')app.innerHTML=nav()+weekScreen();if(route==='done')app.innerHTML=nav()+doneScreen();if(route==='add')app.innerHTML=nav()+addScreen();bind();}
function complete(id,d){const t=tasks.find(x=>x.id===id);if(!t)return;t.completed ||= {};if(!t.completed[d])t.completed[d]=timeNow();persist();render();showToast('🎉 Молодец! Дело сделано')}
function undo(id,d){const t=tasks.find(x=>x.id===id);if(!t||!t.completed)return;delete t.completed[d];persist();render();showToast('↩️ Дело возвращено в список')}
function bind(){app.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>complete(b.dataset.done,b.dataset.day));app.querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>undo(b.dataset.undo,b.dataset.day));app.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editId=b.dataset.edit;go('add')});app.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(!confirm('Удалить это дело?'))return;tasks=tasks.filter(t=>t.id!==b.dataset.delete);persist();render();showToast('Дело удалено')});app.querySelector('#addMain')?.addEventListener('click',()=>{editId=null;go('add')});app.querySelector('#backToday')?.addEventListener('click',()=>go('today'));app.querySelector('#clearOld')?.addEventListener('click',()=>{if(!confirm('Очистить отметки о сделанных делах за прошлую неделю? Сами дела останутся.'))return;const monday=mondayOf(isoDate());for(const t of tasks)for(const d of Object.keys(t.completed||{}))if(d<monday)delete t.completed[d];persist();render();showToast('Сделанные дела за прошлую неделю очищены')});app.querySelectorAll('[data-template]').forEach(b=>b.onclick=()=>{document.querySelector('#taskTitle').value=b.dataset.template;document.querySelector('#taskEmoji').value=b.dataset.emoji;document.querySelector('#taskPeriod').value=b.dataset.period;document.querySelector('#taskTime').value='';document.querySelector('#taskTitle').focus()});app.querySelectorAll('[data-day-choice]').forEach(b=>b.onclick=()=>{const date=document.querySelector('#taskDate');if(b.dataset.dayChoice==='today')date.value=isoDate();if(b.dataset.dayChoice==='tomorrow')date.value=addDays(isoDate(),1);if(b.dataset.dayChoice==='pick')date.focus()});const form=app.querySelector('#taskForm');if(form){const icon=app.querySelector('#taskEmoji');if(editId){const item=tasks.find(t=>t.id===editId);if(item)icon.value=item.emoji||'📝';app.querySelector('#taskPeriod').value=item?.period||'morning';app.querySelector('#taskRepeat').value=item?.repeat||'once'}form.onsubmit=e=>{e.preventDefault();const title=document.querySelector('#taskTitle').value.trim();if(!title)return;const exact=document.querySelector('#taskTime').value,period=exact?(Number(exact.slice(0,2))<12?'morning':Number(exact.slice(0,2))<18?'day':'evening'):document.querySelector('#taskPeriod').value;const values={title,emoji:icon.value,date:document.querySelector('#taskDate').value,time:exact||PERIOD[period].replace(/^\S+\s/,''),period,repeat:document.querySelector('#taskRepeat').value};if(editId){const item=tasks.find(t=>t.id===editId);Object.assign(item,values);editId=null}else tasks.push({id:crypto.randomUUID(),...values,completed:{}});persist();go('today');setTimeout(()=>showToast(`✅ Дело добавлено ${values.date===isoDate()?'на сегодня':'на выбранный день'} ${exact?`в ${exact}`:''}`),60)};app.querySelector('#cancelAdd').onclick=()=>{editId=null;go('today')}}}
window.addEventListener('hashchange',render);if(user&&(USERS[user.login]||(user.provider==='google'&&user.login.startsWith('google:'))))loadTasks();else if(user){user=null;localStorage.removeItem('luna_user')}if(!location.hash)location.hash=user?'#/today':'#/login';render();setInterval(()=>{if(user&&route==='today'){const box=app.querySelector('.greeting');if(box){const d=isoDate(),rem=reminders(d);const old=app.querySelector('.reminder');if(rem){if(old)old.outerHTML=rem;else box.insertAdjacentHTML('afterend',rem)}}}},30000);
</script></body></html>
