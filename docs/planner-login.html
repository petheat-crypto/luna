<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — Луна Академия: Мои дела</title><style>
:root{--ink:#102a38;--muted:#344c59;--green:#155a43;--pale:#e3efe7;--line:#74838b;--paper:#fff}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:20px/1.5 Arial,'Open Sans',sans-serif}.panel{max-width:510px;margin:0 auto;padding:24px 20px}.panel h1{font:700 30px/1.25 Georgia,serif;text-align:center;margin:0 0 20px}label{display:block;font-weight:700;margin:14px 0 6px}input{width:100%;height:60px;border:2px solid #536671;border-radius:8px;padding:10px 14px;font:inherit}button{width:100%;min-height:60px;margin-top:18px;border:0;border-radius:10px;background:var(--green);color:white;font:700 21px Arial,sans-serif;cursor:pointer}button:hover{background:#104632}button:focus-visible,input:focus-visible{outline:4px solid #935800;outline-offset:3px}.error{min-height:30px;color:#762d24;font-weight:700}.demo{margin-top:22px;padding:16px;background:var(--pale);border-radius:10px}.demo strong{display:block}.hint{color:var(--muted);font-size:18px;margin-top:10px}
</style></head><body><main class="panel"><h1>Войти в «Мои дела»</h1><form id="form"><label for="login">Логин</label><input id="login" name="username" autocomplete="username" required><label for="password">Пароль</label><input id="password" name="password" type="password" autocomplete="current-password" required><div class="error" id="error" role="alert" aria-live="polite"></div><button type="submit">Войти</button></form><p class="hint">Введите логин и пароль своей учётной записи.</p><div class="demo"><strong>Тестовый вход</strong>nina / 1234<br>boris / 1234<br>test / test</div></main><script>
const users={nina:{name:'Нина',password:'1234'},boris:{name:'Борис',password:'1234'},test:{name:'Тестовый пользователь',password:'test'}};document.querySelector('#form').onsubmit=e=>{e.preventDefault();const login=document.querySelector('#login').value.trim().toLowerCase(),password=document.querySelector('#password').value,account=users[login];if(!account||account.password!==password){document.querySelector('#error').textContent='Проверьте логин и пароль.';return}const requested=new URLSearchParams(location.search).get('parent'),parentOrigin=requested==='https://owlet.bond'?requested:location.origin;parent.postMessage({type:'luna-planner-login',login,name:account.name},parentOrigin)};
</script></body></html>
