<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Луна Академия</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet"><style>
:root{--ink:#1b2b36;--muted:#4e606b;--paper:#f7f6f1;--white:#fff;--line:#c9d1d1;--green:#176b52;--pale:#e4f1e9;--gold:#e2ae4e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:20px/1.55 'Open Sans',sans-serif}button,input{font:inherit}button{min-height:58px;border:0;border-radius:10px;padding:12px 20px;background:var(--green);color:#fff;font-weight:700;cursor:pointer}button:hover{background:#10513e}button:focus-visible,input:focus-visible{outline:4px solid #aa6500;outline-offset:3px}.shell{max-width:1320px;margin:auto;padding:0 26px}.header{height:86px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font:700 27px Merriweather,serif}.brand b{color:var(--green)}.header-actions{display:flex;gap:12px;align-items:center}.quiet{background:#334b5a}.screen{padding:28px 0 60px}h1,h2,h3{font-family:Merriweather,serif;line-height:1.25}h1{font-size:40px;margin:0 0 8px}h2{font-size:30px;margin:10px 0 18px}h3{font-size:23px;margin:0 0 8px}.muted{color:var(--muted)}.login{max-width:540px;margin:44px auto;background:#fff;padding:32px;border:1px solid var(--line);border-radius:14px}.login label{font-weight:700;display:block;margin:14px 0 5px}.login input{width:100%;height:58px;border:2px solid #71828b;border-radius:8px;padding:12px}.login button{width:100%;margin-top:18px}.google-login{display:flex;align-items:center;justify-content:center;min-height:58px;margin-top:12px;padding:12px 18px;background:#fff;color:#20313b;border:2px solid #74838c;border-radius:10px;font-weight:700;text-decoration:none}.google-login:hover{background:#edf3ef}.demo{background:#edf3ef;border-radius:10px;padding:15px;margin-top:22px}.error{color:#8f221c;font-weight:700}.layout{display:grid;grid-template-columns:260px 1fr;gap:30px}.side{padding:22px 0;border-right:1px solid var(--line)}.side button{display:block;width:calc(100% - 18px);margin:8px 0;text-align:left;background:transparent;color:var(--ink)}.side button.active,.side button:hover{background:var(--pale);color:#124b38}.side .help{border-top:1px solid var(--line);margin-top:22px;padding-top:20px}.content{min-width:0;padding:28px 0}.welcome{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:26px}.date{color:var(--muted)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0 30px}.stat{background:#fff;border:1px solid var(--line);padding:17px 19px;border-radius:12px}.stat strong{display:block;font-size:26px;color:#185d47}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:24px 0 14px}.courses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:white;border:1px solid var(--line);border-radius:13px;overflow:hidden;display:flex;flex-direction:column}.cover{height:12px}.cardbody{padding:20px;display:flex;flex-direction:column;flex:1}.cardbody p{margin:4px 0 12px}.cardbody button{margin-top:auto}.tag{display:inline-block;padding:5px 10px;border-radius:7px;background:var(--pale);color:#14583f;font-weight:700;margin:4px 0 12px}.progress{height:17px;background:#dce2e2;border-radius:12px;overflow:hidden;margin:8px 0}.progress div{height:100%;background:var(--green)}.course-detail{background:white;border:1px solid var(--line);padding:24px;border-radius:14px}.lesson{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:15px 0;border-bottom:1px solid var(--line)}.lesson button{min-width:180px}.notice{padding:14px 17px;border-radius:10px;background:#edf3ef;margin:10px 0}.notif{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin:12px 0}.notif.unread{border-left:5px solid var(--gold)}.cookie{position:fixed;z-index:5;bottom:18px;left:50%;transform:translateX(-50%);width:min(900px,calc(100% - 28px));background:white;border:2px solid #829098;box-shadow:0 8px 30px #172a3a33;border-radius:14px;padding:20px}.cookie-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.cookie button{min-height:52px}.cookie .secondary{background:#334b5a}.small{font-size:17px}.hide{display:none!important}.empty{padding:20px;background:white;border:1px solid var(--line);border-radius:12px}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line);display:flex;overflow:auto;padding:8px 0}.side button{white-space:nowrap;width:auto}.side .help{border:0;margin:8px 0;padding:0}.content{padding-top:18px}.summary{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){body{font-size:18px}.shell{padding:0 15px}.header{height:72px}.brand{font-size:22px}.courses{grid-template-columns:1fr}.summary{grid-template-columns:1fr}.welcome{display:block}h1{font-size:32px}.toolbar{display:block}.lesson{align-items:flex-start;flex-direction:column}.lesson button{width:100%}.cookie-actions button{flex:1}}
</style></head><body><div class="shell"><header class="header"><div class="brand"><b>Луна</b> Академия</div><div class="header-actions"><span id="userlabel" class="muted"></span><button id="logout" class="quiet hide">Выйти</button></div></header><main id="app" class="screen" aria-live="polite"></main></div><div id="cookie" class="cookie hide" role="dialog" aria-label="Настройки cookies"><strong>Настройки cookies</strong><p class="small">Мы используем необходимые cookies для входа и сохранения сессии. Аналитические cookies включаются только с вашего согласия. Вы можете принять все cookies или оставить только необходимые.</p><div class="cookie-actions"><button id="accept-all">Принять все</button><button id="accept-needed" class="secondary">Только необходимые</button><button id="custom-cookies" class="secondary">Настроить</button></div><div id="cookie-custom" class="hide"><label><input type="checkbox" checked disabled> Необходимые для входа и работы портала</label><label><input id="analytics" type="checkbox"> Аналитические (необязательные)</label><button id="save-cookies">Сохранить выбор</button></div></div><script>
const app=document.querySelector('#app'), cookie=document.querySelector('#cookie'), logout=document.querySelector('#logout');let state=null,route=location.pathname==='/catalog'?'catalog':location.pathname==='/notifications'?'notifications':location.pathname==='/help'?'help':location.pathname.startsWith('/course/')?'course':'courses';window.currentCourse=location.pathname.startsWith('/course/')?location.pathname.split('/')[2]:null;const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));async function api(url,body){const r=await fetch(url,body?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}:{});const d=await r.json();if(!r.ok)throw Error(d.error||'Ошибка');return d}function toast(t){const n=document.createElement('div');n.className='notice';n.textContent=t;app.prepend(n);setTimeout(()=>n.remove(),4500)}
async function init(){try{const m=await api('/api/me');document.querySelector('#userlabel').textContent=m.user.name;logout.classList.remove('hide');state=await api('/api/state');if(location.pathname==='/'||location.pathname==='/login')return location.replace('/dashboard');render()}catch{if(location.pathname!=='/login')location.replace('/login');else login()}if(!document.cookie.split('; ').some(x=>x.startsWith('luna_consent=')))cookie.classList.remove('hide')}
function login(msg=''){document.querySelector('#userlabel').textContent='';logout.classList.add('hide');app.innerHTML=`<section class="login"><h1>Добро пожаловать!</h1><p>Здесь вы освоите компьютер в спокойном темпе. Уроки можно проходить по одному.</p><form id="form"><label for="login">Логин</label><input id="login" autocomplete="username" required><label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password" required><p class="error" id="err">${esc(msg)}</p><button>Войти в академию</button></form><a class="google-login" href="/auth/google">Войти через Google</a><div class="demo"><strong>Демо-доступ</strong>ivan / 1234<br>maria / 1234<br>test / test</div></section>`;document.querySelector('.google-login').onclick=e=>{e.preventDefault();window.addEventListener('message',event=>{if(event.origin===location.origin&&event.data==='luna-google-auth-complete')location.assign('/dashboard')},{once:true});const popup=window.open('/auth/google?popup=1','luna-google-login','popup,width=520,height=680');if(!popup)return location.assign('/auth/google');const poll=setInterval(()=>api('/api/me').then(()=>{clearInterval(poll);location.assign('/dashboard')}).catch(()=>{if(popup.closed)clearInterval(poll)}),700);setTimeout(()=>clearInterval(poll),180000)};document.querySelector('#form').onsubmit=async e=>{e.preventDefault();try{await api('/api/login',{login:document.querySelector('#login').value,password:document.querySelector('#password').value});location.assign('/dashboard')}catch(err){document.querySelector('#err').textContent=err.message}}}
function render(){if(!state)return;const courses=state.courses,enrolled=state.enrollments,progress=state.progress;const totalDone=Object.values(progress).reduce((n,a)=>n+a.length,0);app.innerHTML=`<div class="layout"><nav class="side" aria-label="Главное меню"><button data-route="courses" class="${route==='courses'?'active':''}">Мои курсы</button><button data-route="catalog" class="${route==='catalog'?'active':''}">Каталог курсов</button><button data-route="notifications" class="${route==='notifications'?'active':''}">Уведомления</button><button data-route="help" class="${route==='help'?'active':''}">Помощь</button><div class="help muted small">Можно учиться в своём темпе. Ваш прогресс сохраняется на этом компьютере.</div></nav><section class="content">${route==='course'?coursePage():route==='notifications'?notificationsPage():route==='help'?helpPage():dashboardPage()}</section></div>`;app.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>location.assign(b.dataset.route==='courses'?'/dashboard':'/'+b.dataset.route));app.querySelectorAll('[data-enroll]').forEach(b=>b.onclick=async()=>{try{await api('/api/enroll',{id:b.dataset.enroll});location.assign('/dashboard')}catch(e){toast(e.message)}});app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>location.assign('/course/'+b.dataset.open));app.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=async()=>{await api('/api/lesson',{id:window.currentCourse,lesson:Number(b.dataset.lesson)});state=await api('/api/state');render();toast('Урок отмечен как пройденный.')});app.querySelectorAll('[data-read]').forEach(b=>b.onclick=async()=>{await api('/api/notification/read',{id:b.dataset.read});state=await api('/api/state');render()})}
function dashboardPage(){const date=new Intl.DateTimeFormat('ru-RU',{dateStyle:'full'}).format(new Date());const list=state.courses.filter(c=>route==='catalog'||state.enrollments.includes(c.id));return `<div class="welcome"><div><h1>Здравствуйте, ${esc(state.user.name)}!</h1><div class="date">${date}</div></div><div class="muted">Учимся спокойно, шаг за шагом</div></div><div class="summary"><div class="stat"><strong>${state.enrollments.length}</strong>Курсов в обучении</div><div class="stat"><strong>${Object.values(state.progress).reduce((n,a)=>n+a.length,0)}</strong>Уроков пройдено</div><div class="stat"><strong>${state.enrollments.filter(id=>{let c=state.courses.find(x=>x.id===id);return c&&state.progress[id]?.length===c.lessons.length}).length}</strong>Курсов завершено</div></div><div class="toolbar"><h2>${route==='catalog'?'Каталог курсов':'Мои курсы'}</h2>${route==='courses'?'<button class="quiet" id="browse">Выбрать курс</button>':''}</div>${list.length?`<div class="courses">${list.map(c=>{const on=state.enrollments.includes(c.id),n=(state.progress[c.id]||[]).length,p=Math.round(n/c.lessons.length*100);return `<article class="card"><div class="cover" style="background:${c.color}"></div><div class="cardbody"><h3>${esc(c.title)}</h3><p>${esc(c.desc)}</p><p class="muted">${esc(c.time)}</p>${on?`<span class="tag">Вы записаны</span><div>Пройдено ${n} из ${c.lessons.length} уроков · ${p}%</div><div class="progress"><div style="width:${p}%"></div></div><button data-open="${c.id}">Открыть курс</button>`:`<span class="muted">Доступен для записи</span><button data-enroll="${c.id}">Записаться на курс</button>`}</div></article>`}).join('')}</div>`:'<div class="empty">Вы пока не записаны на курсы. Откройте каталог и выберите первый курс.</div>'}`}
function coursePage(){const c=state.courses.find(x=>x.id===window.currentCourse);if(!c)return '<p>Курс не найден.</p>';const done=state.progress[c.id]||[],pct=Math.round(done.length/c.lessons.length*100);return `<button class="quiet" id="back">← Назад к курсам</button><article class="course-detail" style="margin-top:16px"><div class="cover" style="height:110px;border-radius:9px;background:${c.color}"></div><h1 style="margin-top:20px">${esc(c.title)}</h1><p>${esc(c.desc)}</p><h2>Прогресс обучения</h2><div class="progress" style="height:23px"><div style="width:${pct}%"></div></div><p>Пройдено ${done.length} из ${c.lessons.length} уроков · ${pct}%</p><h2>Уроки курса</h2>${c.lessons.map((l,i)=>`<div class="lesson"><div><strong>${i+1}. ${esc(l)}</strong><br><span class="muted">${done.includes(i)?'✓ Пройден':i===done.length?'▶ Текущий урок':'○ Не начат'}</span></div><button data-lesson="${i}" ${done.includes(i)?'disabled class="quiet"':''}>${done.includes(i)?'Урок пройден':i===done.length?'Начать урок':'Продолжить'}</button></div>`).join('')}</article>`}
function notificationsPage(){return `<h1>Уведомления</h1><p>Новости обучения и полезные напоминания.</p><div class="notif unread"><strong>Добро пожаловать в Луна Академию!</strong><p>Начните с курса «Знакомство с компьютером» или выберите интересующую тему в каталоге.</p><button data-route="catalog">Посмотреть курсы</button></div><div class="notif"><strong>Ваш прогресс сохраняется</strong><p>Можно закрыть страницу и вернуться к урокам позже на этом компьютере.</p></div>`}
function helpPage(){return `<h1>Помощь</h1><div class="notif"><h3>Как записаться на курс?</h3><p>Откройте каталог курсов и нажмите «Записаться на курс». Затем курс появится в разделе «Мои курсы».</p></div><div class="notif"><h3>Как проходит урок?</h3><p>Откройте записанный курс и нажмите кнопку рядом с уроком. В этом учебном макете нажатие отмечает урок пройденным.</p></div><div class="notif"><h3>Как сохранить прогресс?</h3><p>Прогресс сохраняется на сервере в локальном файле данных, пока запущен портал.</p></div>`}
logout.onclick=async()=>{await api('/api/logout');location.assign('/login')};document.querySelector('#accept-all').onclick=()=>saveConsent('all');document.querySelector('#accept-needed').onclick=()=>saveConsent('necessary');document.querySelector('#custom-cookies').onclick=()=>document.querySelector('#cookie-custom').classList.toggle('hide');document.querySelector('#save-cookies').onclick=()=>saveConsent(document.querySelector('#analytics').checked?'all':'necessary');async function saveConsent(choice){await api('/api/consent',{choice});cookie.classList.add('hide')}document.addEventListener('click',e=>{if(e.target.id==='browse'){location.assign('/catalog')}if(e.target.id==='back'){location.assign('/dashboard')}});init();
</script></body></html>
